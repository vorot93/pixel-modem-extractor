[package]
name = "pixel-modem-extractor"
version = "2.0.0"
edition = "2024"
authors = ["Artem Vorotnikov <artem@vorotnikov.me>"]
license = "Apache-2.0"
description = "Extract and analyze Pixel/Shannon S5400 modem firmware from a radio FBPK image."
repository = "https://github.com/vorot93/pixel-modem-extractor"
readme = "README.md"
keywords = ["firmware", "baseband", "reverse-engineering", "pixel", "modem"]
categories = ["command-line-utilities"]

[[bin]]
name = "pixel-modem-extractor"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1"
atomic-write-file = "0.3.1"
blake3 = "1.8.6"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.5"
ext4-view = { version = "0.9", features = ["std"] }
flate2 = "1"
paq = "1.4.1"
regex = "1"
scaleservers-arm32-assembly = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
typed-path = "0.12.3"

# Unix-only: Surface B's tighten-watch kills the Ghidra process group
# (`analyzeHeadless` bash launcher + its Java grandchild) via `kill(-pgid, SIGKILL)`.
[target.'cfg(unix)'.dependencies]
libc = "0.2.188"

[target."cfg(windows)".dependencies]
# Cancel blocking version-probe pipe reads before joining their threads.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3.27.0"
